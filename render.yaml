# Render 블루프린트: 'Deploy to Render' 버튼을 누르면 교회 1곳용 서버가 새로 만들어집니다.
services:
  - type: web
    name: church-booking
    runtime: node
    plan: starter            # 영구 디스크는 유료 플랜에서만 가능 (무료는 재시작 시 데이터 삭제)
    region: singapore        # 한국과 가장 가까운 지역
    buildCommand: "true"     # 외부 패키지 없음
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DB_PATH
        value: /var/data/reservations.db
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true  # 자동 생성
      - key: ADMIN_PASSWORD
        sync: false          # 배포할 때 교회 담당자가 직접 입력
      - key: CHURCH_NAME
        sync: false          # 예: 감람교회 (나중에 관리자 화면에서 변경 가능)
